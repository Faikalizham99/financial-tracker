name: Build release artifacts

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_PATH: FinancialTracker.csproj

jobs:
  resolve_version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      display_version: ${{ steps.version.outputs.display_version }}
      build_version: ${{ steps.version.outputs.build_version }}
    steps:
      - name: Resolve app version from tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tags must use the format vMAJOR.MINOR.PATCH, for example v3.2.22." >&2
            exit 1
          fi

          app_display_version="${BASH_REMATCH[1]}"
          app_build_version="$GITHUB_RUN_NUMBER"

          echo "display_version=$app_display_version" >> "$GITHUB_OUTPUT"
          echo "build_version=$app_build_version" >> "$GITHUB_OUTPUT"
          echo "Building Financial Tracker $app_display_version ($app_build_version)"

  build-ios:
    name: Build unsigned iPhone IPA
    needs: resolve_version
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      TARGET_FRAMEWORK: net10.0-ios
      RUNTIME_IDENTIFIER: ios-arm64
      APP_DISPLAY_VERSION: ${{ needs.resolve_version.outputs.display_version }}
      APP_BUILD_VERSION: ${{ needs.resolve_version.outputs.build_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Show build environment
        run: |
          dotnet --info
          xcodebuild -version
          xcode-select -p

      - name: Install the .NET MAUI iOS workload
        run: dotnet workload install maui-ios

      - name: Restore iOS dependencies
        run: >-
          dotnet restore "$PROJECT_PATH"
          -p:TargetFramework="$TARGET_FRAMEWORK"
          -p:RuntimeIdentifier="$RUNTIME_IDENTIFIER"
          -p:ApplicationDisplayVersion="$APP_DISPLAY_VERSION"
          -p:ApplicationVersion="$APP_BUILD_VERSION"

      - name: Build unsigned ARM64 iPhone app
        run: >-
          dotnet publish "$PROJECT_PATH"
          -f "$TARGET_FRAMEWORK"
          -c Release
          -r "$RUNTIME_IDENTIFIER"
          --no-restore
          -p:ArchiveOnBuild=false
          -p:BuildIpa=false
          -p:EnableCodeSigning=false
          -p:CodesignRequireProvisioningProfile=false
          -p:ApplicationDisplayVersion="$APP_DISPLAY_VERSION"
          -p:ApplicationVersion="$APP_BUILD_VERSION"

      - name: Package and verify LiveContainer IPA
        id: package
        shell: bash
        run: |
          set -euo pipefail

          output_root="$GITHUB_WORKSPACE/bin/Release/$TARGET_FRAMEWORK/$RUNTIME_IDENTIFIER"
          if [[ ! -d "$output_root" ]]; then
            echo "Expected iOS output directory was not created: $output_root" >&2
            exit 1
          fi

          candidates_file=$(mktemp "$RUNNER_TEMP/financialtracker-apps.XXXXXX")
          find "$output_root" -type d -name '*.app' -prune | sort > "$candidates_file"
          printf 'Discovered .app bundles:\n'
          if [[ -s "$candidates_file" ]]; then
            sed 's/^/  /' "$candidates_file"
          else
            echo "  <none>"
          fi

          app_path=""
          while IFS= read -r candidate; do
            if [[ "$(dirname "$candidate")" == "$output_root" ]]; then
              app_path="$candidate"
              break
            fi
          done < "$candidates_file"

          app_count=$(wc -l < "$candidates_file" | tr -d ' ')
          if [[ -z "$app_path" && "$app_count" -eq 1 ]]; then
            app_path=$(head -n 1 "$candidates_file")
          fi

          if [[ -z "$app_path" ]]; then
            echo "Could not identify one primary iOS .app bundle." >&2
            exit 1
          fi

          info_plist="$app_path/Info.plist"
          if [[ ! -f "$info_plist" ]]; then
            echo "The selected app bundle has no Info.plist: $app_path" >&2
            exit 1
          fi

          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info_plist")
          executable_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$info_plist")
          bundle_display_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info_plist")
          bundle_build_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info_plist")
          executable_path="$app_path/$executable_name"

          if [[ "$bundle_id" != "com.faikalizham.financial-tracker" ]]; then
            echo "Unexpected bundle identifier: $bundle_id" >&2
            exit 1
          fi

          if [[ "$bundle_display_version" != "$APP_DISPLAY_VERSION" ]]; then
            echo "Unexpected app version: $bundle_display_version (expected $APP_DISPLAY_VERSION)" >&2
            exit 1
          fi

          if [[ "$bundle_build_version" != "$APP_BUILD_VERSION" ]]; then
            echo "Unexpected build number: $bundle_build_version (expected $APP_BUILD_VERSION)" >&2
            exit 1
          fi

          if [[ ! -f "$executable_path" ]]; then
            echo "App executable was not found: $executable_path" >&2
            exit 1
          fi

          architectures=$(lipo -archs "$executable_path")
          if [[ " $architectures " != *" arm64 "* ]]; then
            echo "The app executable is not ARM64: $architectures" >&2
            exit 1
          fi
          if [[ " $architectures " == *" x86_64 "* ]]; then
            echo "The app unexpectedly contains a simulator x86_64 slice: $architectures" >&2
            exit 1
          fi

          if codesign -d "$app_path" >/dev/null 2>&1; then
            signing_state="signed (unexpected; inspect the workflow log)"
          else
            signing_state="unsigned (expected; LiveContainer/SideStore will re-sign it)"
          fi

          package_root=$(mktemp -d "$RUNNER_TEMP/financialtracker-ipa.XXXXXX")
          mkdir -p "$package_root/Payload" "$GITHUB_WORKSPACE/artifacts"
          ditto "$app_path" "$package_root/Payload/$(basename "$app_path")"

          ipa_path="$GITHUB_WORKSPACE/artifacts/FinancialTracker.ipa"
          (
            cd "$package_root"
            /usr/bin/zip -qry "$ipa_path" Payload
          )

          if [[ ! -s "$ipa_path" ]]; then
            echo "FinancialTracker.ipa was not created or is empty." >&2
            exit 1
          fi

          payload_app_count=$(
            unzip -Z1 "$ipa_path" |
              awk -F/ '$1 == "Payload" && $2 ~ /[.]app$/ && $3 == "" && NF == 3 { count++ } END { print count + 0 }'
          )
          if [[ "$payload_app_count" -ne 1 ]]; then
            echo "IPA must contain exactly one top-level Payload/*.app bundle." >&2
            unzip -Z1 "$ipa_path" | head -100
            exit 1
          fi

          ipa_size=$(du -h "$ipa_path" | cut -f1)
          ipa_sha256=$(shasum -a 256 "$ipa_path" | awk '{print $1}')

          echo "app_path=$app_path" >> "$GITHUB_OUTPUT"
          echo "ipa_path=$ipa_path" >> "$GITHUB_OUTPUT"

          echo "App bundle: $app_path"
          echo "Bundle ID: $bundle_id"
          echo "Version: $bundle_display_version ($bundle_build_version)"
          echo "Architectures: $architectures"
          echo "Signing: $signing_state"
          echo "IPA: $ipa_path"
          echo "IPA size: $ipa_size"
          echo "IPA SHA-256: $ipa_sha256"

          {
            echo "### FinancialTracker iOS artifact"
            echo "- App bundle: \`$app_path\`"
            echo "- Bundle ID: \`$bundle_id\`"
            echo "- Version: \`$bundle_display_version ($bundle_build_version)\`"
            echo "- Architectures: \`$architectures\`"
            echo "- Signing: $signing_state"
            echo "- IPA: \`$ipa_path\`"
            echo "- IPA size: $ipa_size"
            echo "- IPA SHA-256: \`$ipa_sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload FinancialTracker IPA
        uses: actions/upload-artifact@v7
        with:
          name: FinancialTracker-IPA
          path: artifacts/FinancialTracker.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build-android:
    name: Build Android APK
    needs: resolve_version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_FRAMEWORK: net10.0-android
      APP_DISPLAY_VERSION: ${{ needs.resolve_version.outputs.display_version }}
      APP_BUILD_VERSION: ${{ needs.resolve_version.outputs.build_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install the .NET MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore Android dependencies
        run: >-
          dotnet restore "$PROJECT_PATH"
          -p:TargetFramework="$TARGET_FRAMEWORK"
          -p:ApplicationDisplayVersion="$APP_DISPLAY_VERSION"
          -p:ApplicationVersion="$APP_BUILD_VERSION"

      - name: Build Android APK
        run: >-
          dotnet publish "$PROJECT_PATH"
          -f "$TARGET_FRAMEWORK"
          -c Release
          --no-restore
          -p:AndroidPackageFormats=apk
          -p:ApplicationDisplayVersion="$APP_DISPLAY_VERSION"
          -p:ApplicationVersion="$APP_BUILD_VERSION"

      - name: Package and verify Android APK
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $androidNamespace = 'http://schemas.android.com/apk/res/android'
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'obj/Release/net10.0-android/android/AndroidManifest.xml'
          if (-not (Test-Path -LiteralPath $manifestPath)) {
            throw "Generated Android manifest was not found: $manifestPath"
          }

          [xml]$manifest = Get-Content -LiteralPath $manifestPath -Raw
          $versionName = $manifest.DocumentElement.GetAttribute('versionName', $androidNamespace)
          $versionCode = $manifest.DocumentElement.GetAttribute('versionCode', $androidNamespace)
          if ($versionName -ne $env:APP_DISPLAY_VERSION) {
            throw "Unexpected Android version name: $versionName (expected $env:APP_DISPLAY_VERSION)"
          }
          if ($versionCode -ne $env:APP_BUILD_VERSION) {
            throw "Unexpected Android version code: $versionCode (expected $env:APP_BUILD_VERSION)"
          }

          $publishRoot = Join-Path $env:GITHUB_WORKSPACE 'bin/Release/net10.0-android/publish'
          $apk = Get-ChildItem -LiteralPath $publishRoot -Filter '*-Signed.apk' -File |
            Select-Object -First 1
          if ($null -eq $apk) {
            $apk = Get-ChildItem -LiteralPath $publishRoot -Filter '*.apk' -File |
              Select-Object -First 1
          }
          if ($null -eq $apk) {
            throw "No Android APK was produced in $publishRoot"
          }

          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts/android'
          New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null
          $artifactPath = Join-Path $artifactRoot 'FinancialTracker.apk'
          Copy-Item -LiteralPath $apk.FullName -Destination $artifactPath
          $sha256 = (Get-FileHash -LiteralPath $artifactPath -Algorithm SHA256).Hash.ToLowerInvariant()

          "apk_path=$artifactPath" >> $env:GITHUB_OUTPUT
          @"
          ### FinancialTracker Android artifact
          - Version: ``$versionName ($versionCode)``
          - APK: ``$artifactPath``
          - SHA-256: ``$sha256``
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Upload FinancialTracker APK
        uses: actions/upload-artifact@v7
        with:
          name: FinancialTracker-Android
          path: artifacts/android/FinancialTracker.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build-windows:
    name: Build Windows app
    needs: resolve_version
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TARGET_FRAMEWORK: net10.0-windows10.0.19041.0
      RUNTIME_IDENTIFIER: win-x64
      APP_DISPLAY_VERSION: ${{ needs.resolve_version.outputs.display_version }}
      APP_BUILD_VERSION: ${{ needs.resolve_version.outputs.build_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install the .NET MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Restore Windows dependencies
        shell: pwsh
        run: >-
          dotnet restore "$env:PROJECT_PATH"
          -p:TargetFramework="$env:TARGET_FRAMEWORK"
          -p:RuntimeIdentifier="$env:RUNTIME_IDENTIFIER"
          -p:ApplicationDisplayVersion="$env:APP_DISPLAY_VERSION"
          -p:ApplicationVersion="$env:APP_BUILD_VERSION"

      - name: Build Windows app
        shell: pwsh
        run: >-
          dotnet publish "$env:PROJECT_PATH"
          -f "$env:TARGET_FRAMEWORK"
          -c Release
          -r "$env:RUNTIME_IDENTIFIER"
          --no-restore
          -p:WindowsPackageType=None
          -p:ApplicationDisplayVersion="$env:APP_DISPLAY_VERSION"
          -p:ApplicationVersion="$env:APP_BUILD_VERSION"

      - name: Package and verify Windows app
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publishRoot = Join-Path $env:GITHUB_WORKSPACE "bin/Release/$env:TARGET_FRAMEWORK/$env:RUNTIME_IDENTIFIER/publish"
          $assemblyPath = Join-Path $publishRoot 'FinancialTracker.dll'
          if (-not (Test-Path -LiteralPath $assemblyPath)) {
            throw "Windows application assembly was not found: $assemblyPath"
          }

          $assemblyInfoPath = Join-Path $env:GITHUB_WORKSPACE "obj/Release/$env:TARGET_FRAMEWORK/$env:RUNTIME_IDENTIFIER/FinancialTracker.AssemblyInfo.cs"
          if (-not (Test-Path -LiteralPath $assemblyInfoPath)) {
            throw "Generated Windows assembly metadata was not found: $assemblyInfoPath"
          }

          $assemblyInfo = Get-Content -LiteralPath $assemblyInfoPath -Raw
          $versionMatch = [regex]::Match(
            $assemblyInfo,
            'AppInfo[.]Version", "([^"]+)"')
          if (-not $versionMatch.Success) {
            throw 'The Windows AppInfo version metadata could not be read.'
          }

          $actualAppVersion = $versionMatch.Groups[1].Value
          $expectedAppVersion = "$env:APP_DISPLAY_VERSION.$env:APP_BUILD_VERSION"
          if ($actualAppVersion -ne $expectedAppVersion) {
            throw "Unexpected Windows app version: $actualAppVersion (expected $expectedAppVersion)"
          }

          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts/windows'
          New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null
          $artifactPath = Join-Path $artifactRoot 'FinancialTracker-Windows-x64.zip'
          Compress-Archive -Path (Join-Path $publishRoot '*') -DestinationPath $artifactPath -Force
          $sha256 = (Get-FileHash -LiteralPath $artifactPath -Algorithm SHA256).Hash.ToLowerInvariant()

          "zip_path=$artifactPath" >> $env:GITHUB_OUTPUT
          @"
          ### FinancialTracker Windows artifact
          - Version: ``$env:APP_DISPLAY_VERSION ($env:APP_BUILD_VERSION)``
          - Archive: ``$artifactPath``
          - SHA-256: ``$sha256``
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Upload FinancialTracker Windows app
        uses: actions/upload-artifact@v7
        with:
          name: FinancialTracker-Windows-x64
          path: artifacts/windows/FinancialTracker-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
